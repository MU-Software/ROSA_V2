name: rosa
options:
  bundleIdPrefix: com.musoftware.rosa
  # 실효 값은 여기다. tauri.conf.json 의 bundle.iOS.minimumSystemVersion 은
  # 이 파일이 처음 만들어질 때만 반영되고, 그 뒤 `tauri ios init` 은 이 파일을
  # 읽기만 한다. 두 값을 같이 고친다.
  # 15.0 미만은 2027 봄부터 App Store Connect 업로드가 거부된다 (경고 90068).
  deploymentTarget:
    iOS: 15.0
fileGroups: [../../src]
configs:
  debug: debug
  release: release
settingGroups:
  app:
    base:
      PRODUCT_NAME: ROSA
      PRODUCT_BUNDLE_IDENTIFIER: com.musoftware.rosa
      # tauri.conf.json 의 bundle.iOS.developmentTeam 도 이 파일이 처음 만들어질
      # 때만 반영된다. 없으면 빌드가 "requires a development team" 으로 죽는다.
      # 팀 ID 는 비밀이 아니다 — 배포된 앱의 프로비저닝 프로파일에 그대로 들어간다.
      DEVELOPMENT_TEAM: NBM824WDPS
targetTemplates:
  app:
    type: application
    sources:
      - path: Sources
    scheme:
      environmentVariables:
        RUST_BACKTRACE: full
        RUST_LOG: info
    settings:
      groups: [app]
targets:
  rosa_iOS:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Assets.xcassets
      # buildPhase 를 주지 않으면 xcodegen 이 여기 있는 libapp.a 를 Resources 로
      # 추론해 앱 번들 안에 그대로 복사한다. App Store 업로드가 409 로 거부된다
      # ("Invalid bundle structure ... binary file is not permitted").
      # 링크는 아래 dependencies 의 framework 항목과 LIBRARY_SEARCH_PATHS 가 하므로
      # 여기서는 Xcode 내비게이터에 보이기만 하면 된다.
      - path: Externals
        buildPhase: none
      - path: rosa_iOS
      - path: assets
        buildPhase: resources
        type: folder
      - path: LaunchScreen.storyboard
    info:
      path: rosa_iOS/Info.plist
      properties:
        LSRequiresIPhoneOS: true
        UILaunchStoryboardName: LaunchScreen
        UIRequiredDeviceCapabilities: [arm64, metal]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleShortVersionString: 0.1.0
        CFBundleVersion: "0.1.0"
    entitlements:
      path: rosa_iOS/rosa_iOS.entitlements
    scheme:
      environmentVariables:
        RUST_BACKTRACE: full
        RUST_LOG: info
    settings:
      base:
        ENABLE_BITCODE: false
        ARCHS: [arm64]
        VALID_ARCHS: arm64 
        LIBRARY_SEARCH_PATHS[arch=x86_64]: $(inherited) $(PROJECT_DIR)/Externals/x86_64/$(CONFIGURATION) $(SDKROOT)/usr/lib/swift $(TOOLCHAIN_DIR)/usr/lib/swift/$(PLATFORM_NAME) $(TOOLCHAIN_DIR)/usr/lib/swift-5.0/$(PLATFORM_NAME)
        LIBRARY_SEARCH_PATHS[arch=arm64]: $(inherited) $(PROJECT_DIR)/Externals/arm64/$(CONFIGURATION) $(SDKROOT)/usr/lib/swift $(TOOLCHAIN_DIR)/usr/lib/swift/$(PLATFORM_NAME) $(TOOLCHAIN_DIR)/usr/lib/swift-5.0/$(PLATFORM_NAME)
        ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: true
        EXCLUDED_ARCHS[sdk=iphoneos*]: x86_64
      groups: [app]
    dependencies:
      - framework: libapp.a
        embed: false
      # btleplug 의 CoreBluetooth 백엔드가 요구한다. rustc 는 -framework 로 넘기지만
      # Xcode 가 정적 라이브러리를 받아 최종 링크를 하므로 여기서 다시 알려줘야 한다.
      - sdk: CoreBluetooth.framework
      - sdk: CoreGraphics.framework
      - sdk: Metal.framework
      - sdk: MetalKit.framework
      - sdk: QuartzCore.framework
      - sdk: Security.framework
      - sdk: UIKit.framework
      - sdk: WebKit.framework
    preBuildScripts:
      - script: pnpm tauri ios xcode-script -v --platform ${PLATFORM_DISPLAY_NAME:?} --sdk-root ${SDKROOT:?} --framework-search-paths "${FRAMEWORK_SEARCH_PATHS:?}" --header-search-paths "${HEADER_SEARCH_PATHS:?}" --gcc-preprocessor-definitions "${GCC_PREPROCESSOR_DEFINITIONS:-}" --configuration ${CONFIGURATION:?} ${FORCE_COLOR} ${ARCHS:?}
        name: Build Rust Code
        basedOnDependencyAnalysis: false
        outputFiles:
          - $(SRCROOT)/Externals/x86_64/${CONFIGURATION}/libapp.a
          - $(SRCROOT)/Externals/arm64/${CONFIGURATION}/libapp.a