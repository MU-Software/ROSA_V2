[package]
name = "rosa"
version = "0.1.0"
description = "ROSA"
authors = ["musoftware"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "rosa_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.10.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-http = { version = "2.5.9", features = ["unsafe-headers"] }
tokio = { version = "1", features = ["sync", "macros"] }

[target.'cfg(not(target_os = "ios"))'.dependencies]
rusb = "0.9"
serialport = "4"

[target.'cfg(target_os = "android")'.dependencies]
tauri-plugin-bluetooth-spp = { git = "https://github.com/MU-Software/tauri-plugin-bluetooth-spp", rev = "d2fc1eba33e90aabc3af2c65ff98fd7d634e3c95" }

[target.'cfg(target_os = "ios")'.dependencies]
tauri-plugin-blec = "0.12"
